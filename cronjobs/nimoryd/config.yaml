log:
  dir: /home/datar/data/backups/logs
  prefix: nimoryd

system:
  show_stats: true

tailscale:
  enabled: true
  up_command: "tailscale up --ssh"

docker:
  enabled: true
  restart_containers:
    - dashboard

  compose:
    enabled: true
    base_path: /home/datar/docker
    update_interval_days: 5

git:
  paths:
    - /home/datar/data/workspace/narch 
    - /home/datar/data/workspace/nih.ar

build:
  paths:
    - /home/datar/data/workspace/narch/cronjobs/notesctl
    - /home/datar/data/workspace/narch/cronjobs/nimoryd

backup:
  source: /home/datar/data/backups
  target: /home/datar/data/backups/tar
  extensions:
    - ".tar"
    - ".tar.gz"
    - ".gpg"

custom_commands:
  - name: "Dot Pull"
    cmd: "cd /home/nihar && /usr/bin/git --git-dir=$HOME/.config/.dotfile --work-tree=$HOME pull"
  - name: "Clean Home"
    cmd: "cd /home/nihar && rm .sudo_as_admin_successful"
